# ncycle-pipeline — accuracy regression gate (CI)
#
# Fails the build if panel accuracy drops below the floors in
# validation/test_regression.py. Everything it needs is in the repository: the
# 39-genome reference panel (test_panel/), the ground truth, and the pinned inputs of the
# databases (resources/kofam_pinned/, pfam_pinned/, seeds_pinned/). Only the five
# genomes of the smoke test are downloaded (NCBI).

name: regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  accuracy-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}        # login shell so the conda env stays active
    steps:
      - uses: actions/checkout@v4

      - name: Set up the cycle-pipeline conda env
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: envs/ncycle.yaml
          cache-environment: true

      - name: Build the HMM and BLAST databases
        run: make dbs

      - name: Smoke test (5 genomes, runs end to end)
        env:
          NCYCLE_ENV: cycle-pipeline    # ncycle.py reuses the active CI env
        run: make test_protein

      - name: Accuracy regression gate (39 genomes)
        env:
          NCYCLE_ENV: cycle-pipeline
        run: make regression
