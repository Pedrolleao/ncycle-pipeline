notes: "Tier-3 -> Tier-2 custom HMM. Hydrazine dehydrogenase (K20935, EC 1.7.2.8)\
  \ is an octaheme c-type cytochrome of the HAO family with NO clean Pfam, and the\
  \ gene symbol 'hdh' is heavily polluted in UniProt (huntingtin, histidinol/homoserine/\
  \ histamine dehydrogenases) \u2014 so KO/symbol-based calls are ambiguous. This\
  \ clade HMM is trained on bona-fide anammox Hdh (Kuenenia + Scalindua) and calibrated\
  \ above the nitrifier-HAO and NrfA negative band, separating it from its sister\
  \ hao octaheme fold. Few anammox references exist; min_seqs_override=3 (documented\
  \ coverage limit)."
