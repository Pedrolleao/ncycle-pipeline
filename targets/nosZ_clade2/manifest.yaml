notes: "P-batch-3d (2026-05-30) clade-II / atypical nosZ custom HMM. Complements the\
  \ canonical `nosZ` target (K00376 + PF18764 + TIGR04244 calibrated for clade-I Pseudomonas/Paracoccus-style\
  \ NosZ with Tat signal peptide). Clade-II diagnostics: Sec-dependent signal peptide\
  \ (vs Tat in clade-I), divergent gene-cluster context (no nosR), N2O-sink ecology\
  \ (often without upstream nir/nor). The K00376 KOfam profile is calibrated narrowly\
  \ enough that it misses clade-II proteins entirely (Wsuccinogenes proteome: zero\
  \ K00376 hits even at E=100) \u2014 hence the need for a separate clade-II HMM.\
  \ NOT including Wolinella succinogenes seeds (would be self-reference vs the panel\
  \ Wsuccinogenes cell). Seed selection spans 6 phyla: \u03B2-proteo (Dechloromonas),\
  \ \u03B4-proteo (Anaeromyxobacter), Gemmatimonadetes (Gemmatimonas), Bacteroidetes\
  \ (Flavobacterium), Aquificae (Persephonella), Chloroflexota (Caldilinea + Thermomicrobium\
  \ \u2014 P5.2.4 added 2026-05-30 to close Hallin 2018 Chloroflexi / Anaerolineae\
  \ phylogenetic gap). 5 explicitly Sec-dependent annotations; all 7 are published\
  \ clade-II references. expanded_candidates pre-filled keep:true\
  \ to bypass the `expand` step (a SwissProt phmmer expand would surface clade-I Pseudomonas/Paracoccus\
  \ NosZ at ~50%+ identity to seeds, which must NOT enter the training set since clade-I\
  \ is covered by the parent `nosZ` target). CD-HIT 0.99 preserves all 5 (pairwise\
  \ identity 40-65%). Architectural note: keeps K00376 in the KO list as a fallback\
  \ even though it doesn't fire on every clade-II protein \u2014 for clade-II carriers\
  \ where K00376 DOES fire weakly, the KO is still informative; the custom HMM is\
  \ the primary discriminator. The PF18764 nosZ-N-terminal Pfam is kept as a secondary\
  \ signature (clade-II nosZ proteins do carry the N-terminal domain)."
