tc_rationale: "Panel hmmsearch (2026-05-30, P5.2.4-recalibrated after adding 2\
  \ Chloroflexota Sec-dependent nosZ seeds \u2014 Caldilinea aerophila A0A7C1FJ72 +\
  \ Thermomicrobium roseum A0A7C1K3A7). The broader HMM uniformly shifts clade-I\
  \ cross-fire scores upward by ~30-50 bits vs the v11 5-seed model: new training-only\
  \ cross-fire scores are Smeliloti 456.9 (new ceiling), Paeruginosa 446.4,\
  \ Pdenitrificans 435.6, Cnecator 412.6. Clade-II positive scores (seed self-scores\
  \ on the new HMM) are 1043-1080 \u2014 discrimination GAP is preserved (~590 bits) but\
  \ shifted upward. TC=500 sits above the training-only cross-fire ceiling 456.9 by\
  \ +43 bits (~2.3\u03c3 over the training cross-fire spread, \u03c3\u224819), with hold-outs\
  \ (Bdiazoefficiens 469.1, Rpalustris 468.1) EXCLUDED from derivation but\
  \ incidentally below TC=500 by ~31 bits \u2014 no hold-out F1 regression. Below clade-II\
  \ positive floor (1043) by ~543 bits \u2014 wide safety margin against false-negatives\
  \ on real clade-II proteins. Bsinica 62.8, Mfumariolicum 47.2, comammox/AOB scores\
  \ <40 are noise-level. No panel clade-II positive available to verify the\
  \ positive-side TC empirically \u2014 the Wsuccinogenes RefSeq proteome lacks the\
  \ catalytic NosZ subunit (annotation gap, see Block 3d). v11\u2192v12 history: P5.1.2\
  \ set TC=418 against the 5-seed HMM's training ceiling (Smeliloti 414.2 + 3.8 margin);\
  \ P5.2.4 added 2 Chloroflexota seeds (closes Hallin 2018 Chloroflexi /\
  \ Anaerolineae phylogenetic gap), which shifted every cross-fire score up by\
  \ 30-50 bits, forcing TC recalibration. v10 history (further back): TC=420 was\
  \ derived using Bdiazoefficiens 416.8 (hold-out) as ceiling \u2014 retracted in v11."
