notes: "P3 amoA HMM spanning AOB (betaproteobacteria) + comammox (Nitrospira) clades.\
  \ Replaces sole reliance on KOfam K28504, which the divergent comammox amoA scores\
  \ below. Comammox seeds are siblings (nitrificans/nitrosa), NOT inopinata-self.\
  \ TC calibrated to exclude verrucomicrobial methanotroph pmoA. P5.2.1 (2026-05-30,\
  \ post-audit): dropped 2 Fragment-flagged training seeds \u2014 Q7WWN6 (N.multiformis,\
  \ 255 aa, '(Fragment)' in UniProt header) and Q7WWN7 (N.eutropha, 255 aa, '(Fragment)'\
  \ in UniProt header \u2014 newly discovered during P5.2.1 verification; the audit\
  \ recommended Q7WWN7 as a replacement candidate but post-verify fetch found it was\
  \ another fragment). Audit's third specific recommendation, D3RUW6 (allegedly N.briensis\
  \ AmoA), was a wrong accession \u2014 the UniProt entry is ATP synthase subunit\
  \ delta from Allochromatium vinosum, a completely unrelated protein from a purple\
  \ sulfur bacterium. Replacements Q51142 (N.multiformis AmoA1, 274 aa, full-length)\
  \ and A0A0F7KK52 (N.communis, 274 aa, full-length) were verified post-fetch."
