notes: "Tier-3 -> Tier-2 custom HMM. Hydrazine synthase beta subunit (K20933), anammox\
  \ multiheme cytochrome c, no stable Pfam, no homology trap. Custom HMM adds subunit-\
  \ resolved confidence; negatives include HzsA/HzsC to enforce subunit specificity.\
  \ Anammox references scarce \u2014 only 3 full-length seqs but spanning 3 genera\
  \ (Kuenenia, Brocadia, Scalindua); min_seqs_override=3, cdhit_threshold raised to\
  \ 0.95 to retain all three (documented coverage limit). FINDING (2026-05-25): the
  built HMM did NOT discriminate from the sister HzsC subunit (calibration overlap —
  HzsC scored 733 inside the HzsB positive band 347-738). HzsA/B/C are paralogous
  multiheme cytochromes; the short B/C subunits cross-react. Kept Tier-3 BLAST-only
  (curated seeds + identity threshold are position-specific and separate the subunits)
  — the HMM was removed. tc fields below are the rejected calibration, retained as record."
