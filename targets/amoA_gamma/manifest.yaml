notes: "P-batch-3b (2026-05-29) \u03B3-AOB Nitrosococcus-clade AmoA HMM. Complements\
  \ amoA (\u03B2-AOB + comammox, see targets/amoA/) and amoA_archaeal (AOA, PF12942).\
  \ Resolves the Noceani amoA FN documented in REPORT \xA7 Block 2b: Noceani amoA\
  \ scores 271 on the AOB+comammox HMM \u2014 sandwiched between Mfumariolicum pmoA\
  \ at 274 (K28504) / 279 (custom HMM) with no separating threshold.\n\nAUDIT 2026-06-10:\
  \ D5BWX5 (Nitrosococcus halophilus Nc4) REMOVED from the training set \u2014 it\
  \ is the same strain as the Nhalophilus_Nc4 hold-out genome, so it was a same-strain\
  \ seed leak (detect_seed_leakage.py flagged Nhalophilus_Nc4/amoA_gamma). Verified\
  \ empirically free to drop: on the 2-seq HMM (watsonii Q9RAI1 + wardiae A0A4P7BVX1)\
  \ Noceani scores 545 and Nhalophilus 550 (now detected via the wardiae sibling at\
  \ ~96%, NOT its own strain \u2014 a genuine hold-out detection), while the \u03B3\
  -proteobacterial pmoA decoy Mcapsulatus is unchanged at ~388 (3-seq: 389.5, 2-seq:\
  \ 388.2). NOT N. oceani itself (oceani is a test organism). expanded_candidates\
  \ pre-filled to bypass build_custom_hmms.py `expand` (a SwissProt phmmer expand\
  \ would surface N. oceani/halophilus at ~95% identity which must NOT re-enter the\
  \ training set). Verification provenance (UniProt REST API + sequence motif inspection\
  \ + phylogenetic-fit review) recorded in REPORT \xA7 Block 3 and \xA7 Audit 2026-06-10."
