tc_rationale: "\u03B3-AOB targets Noceani 545 / Nhalophilus 550 (2-seq HMM) sit far\
  \ above; the closest decoys are \u03B3-proteobacterial methanotroph pmoA Mcapsulatus\
  \ 388 and verrucomicrobial pmoA Mfumariolicum 288 \u2014 both below TC. TC=400 admits\
  \ the \u03B3-AOB targets by ~145 and excludes Mcapsulatus by ~12. The HMM margin\
  \ to the \u03B3-proteo pmoA decoy is intentionally thin and is BACKSTOPPED by the\
  \ BLAST gate (blast_identity_min: 80): Mcapsulatus pmoA hits the \u03B3-AOB seeds\
  \ at only 65% so even a KO-tier hit is disqualified. \u03B2-AOB Nmultiformis 253\
  \ / Neuropaea 252 and comammox Ninopinata 231 are well below TC (covered by `amoA`).\
  \ Recalibrated 2026-06-10 after removing the D5BWX5 same-strain leak (mirrors amoA/nxrA/nxrB\
  \ precedent)."
