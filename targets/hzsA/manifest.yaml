notes: "Tier-3 -> Tier-2 custom HMM. Hydrazine synthase alpha subunit (K20932) is\
  \ the definitive anammox phylomarker \u2014 a large (~800 aa) multiheme cytochrome\
  \ c with no stable Pfam. It has no homology trap (anammox-unique), so the custom\
  \ HMM mainly adds subunit-resolved confidence over KO+BLAST; negatives include HzsB/HzsC\
  \ to enforce subunit specificity. Anammox references are scarce; training spans\
  \ Kuenenia + Jettenia + 3 Scalindua spp. (5 full-length seqs), min_seqs_override=4\
  \ (documented limit). HzsA scores cleanly (TC 849; the shorter HzsB/HzsC and unrelated\
  \ multihemes do not register). NOTE: per-subunit HMMs were attempted for HzsB and HzsC\
  \ too but they overlap each other (paralogous ~340-380 aa cytochromes) \u2014 kept Tier-3\
  \ BLAST-only; see their manifests."
