notes: Tier-3 -> Tier-2 custom HMM. Hydroxylamine oxidoreductase (K10535) is an octaheme
  cytochrome c with no clean Pfam; its fold is shared with the NrfA pentaheme family
  and the anammox Hdh/HAO octaheme paralogs. This clade HMM is trained on bona-fide
  NITRIFIER HAO (AOB beta+gamma + comammox Nitrospira) and calibrated above the anammox-Hdh/HAO
  and NrfA negative band, so it scores the nitrification HAO clade specifically. Training
  spans 3 AOB + 3 comammox organisms; min_seqs_override=4 because cultured nitrifier
  HAO references are limited.
