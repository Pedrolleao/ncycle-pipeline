# ─────────────────────────────────────────────────────────────────────────────
# targets.yaml — single source of truth for the nitrogen-cycle detection pipeline.
#
# Modeled on Holomicrobiome-ewaste/ewaste-pipeline/config/targets.yaml. Three blocks:
#   targets:    individual enzymes/genes. Each carries KO (primary anchor),
#               a Pfam anchor, an optional custom-HMM tier, and a BLAST
#               fallback/confirmation gate.
#   complexes:  obligatory multi-subunit assemblies. Scored n/N per MAG by the
#               complex-completeness step.
#   synergies:  process-completeness modules (denitrification, comammox,
#               anammox, etc.) flagged in the gap-analysis report.
#
# NEW field vs the ewaste schema: `ko:` (KEGG Orthology, the primary N-cycle anchor).
# All KO numbers verified against the KEGG REST API (May 2026). See Info-nitrogen.md
# for the narrative atlas and ⚠️ rationale. (The `interpro:`, `tigrfam:`, and `ref_query:`
# fields were removed 2026-06-10 — they were documentation-only and never read by any
# script; the InterPro/TIGRFAM provenance lives in Info-nitrogen.md.)
#
# blast_refs_uniprot were originally left empty (`[]`) and CURATED + VERIFIED in the
# tool-build phase rather than guessed (the ewaste project's hardest bug class was
# wrong/fabricated UniProt accessions); they are now populated with verified seeds.
#
# ⚠️ HOMOLOGY TRAPS requiring custom HMM + BLAST gate (requires_blast_for_confirmation):
#   nxrA/nxrB  share KO K00370/K00371 + Pfam with narG/narH
#   amoA       shares PF02461 with methanotroph pmoA (and AOB/AOA/comammox clades)
#   nirB/nirD/nirA  share PF01077 (NIR_SIR) with dsrAB
#   napA       broad PF00384+PF01568 Mo-oxidoreductase family
# ─────────────────────────────────────────────────────────────────────────────
# blast_identity_min — per-target BLAST gate identity floor (documented per
# ROADMAP P5.4.1, 2026-05-30). The %identity scheme:
#
#   30 (default; no override)  — apply_rules.py --pident-default. Used by
#       targets where the KO + Pfam combo is itself the discriminator and BLAST
#       is just a confirmation sanity check (anfG, nirK, nrfH, nirA).
#   40 (baseline curated)      — the standard tight gate for targets with
#       1-3 curated seed clades; reliably excludes unrelated families while
#       admitting all real positives (24 targets — most N-cycle enzymes).
#   45-55                      — known homology trap discriminators. amoA vs
#       methanotroph pmoA (PF02461 shared), nxrA/B vs narG/H (K00370/K00371
#       shared), amoC vs pmoC. Empirically calibrated by walking each target's
#       panel BLAST hit table during P2 seed curation (2026-05-25). See
#       per-target gate_rationale: fields on these.
#   60                         — strictest, nxrA-specific. NarG and NxrA are
#       not sequence-separable below this threshold; identity≥60 + NOB-clade
#       custom HMM + operon-synteny resolver is the three-layer discrimination.
#
# Calibration method: for each target, find the lowest pident at which (a) all
# curated-positive panel cells stay positive AND (b) all known trap proteins
# fall below the floor. Per-target gate_rationale documents the trap and the
# anchor genome cross-fire numbers where applicable.
# ─────────────────────────────────────────────────────────────────────────────

targets:

