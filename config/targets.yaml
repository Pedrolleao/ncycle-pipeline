  # ── 2. Nitrification — ammonia oxidation ──────────────────────────────────
  - id: amoA
    name: Ammonia monooxygenase subunit A (AOB / comammox)
    category: nitrification_ammonia
    ko: [K28504]           # amoA KO (ammonia MO subunit A, EC 1.14.99.39). NB: K28504 is
                           # NOT pmoA-exclusive at the KO level — verrucomicrobial AND
                           # γ-proteobacterial methanotroph pmoA, and archaeal amoA, all
                           # fire K28504 at ~260-280 (right at the KOfam TC ~273; verified
                           # in panel hmmscan output for Mfumariolicum, Mcapsulatus,
                           # Nmaritimus, Nviennensis). K10944 (methane MO) is a distinct KO,
                           # but K28504 alone does NOT separate amoA from pmoA. The real
                           # clade discriminator is the custom HMM + the BLAST gate, not the KO.
    pfam: [PF02461]
    custom_hmm: true
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 55
    blast_refs_uniprot: [Q04507, Q51142, A0A0F7KK52, A0A0S4LM25, A0A0S4LPG4]   # P5.2.1 (2026-05-30): swapped 2 Fragment β-AOB seeds (Q7WWN6+A0A1P8VZN2, both N.multiformis fragments at 255/230 aa) → full-length Q51142 (N.multiformis AmoA1, 274 aa) + A0A0F7KK52 (N.communis, 274 aa). Audit also suggested Q7WWN7 + D3RUW6 but post-verify both were bad: Q7WWN7 = another N.eutropha fragment, D3RUW6 = ATP synthase from Allochromatium vinosum (wrong protein/organism). Final 5 seeds all full-length. identity 55 excludes verrucomicrobial pmoA (Mfumariolicum ~52%). (Originally P2-curated 2026-05-25.)
    gate_rationale: "55 excludes verrucomicrobial methanotroph pmoA (Mfumariolicum BLAST identity to AOB amoA: ~52%) while admitting all β-AOB + comammox amoA hits (Neuropaea/Nmultiformis/Ninopinata/Nnitrosa: 85-100% within-clade). NB: this β-AOB gate is NOT relied on to exclude γ-proteobacterial methanotroph pmoA — see amoA_gamma gate (raised to 80) for that closer trap."
    notes: "⚠️ TRAP: PF02461 AND KOfam K28504 both fire on methanotroph pmoA and archaeal amoA (panel: pmoA/AOA bitscores ~260-280 ≈ the K28504 TC ~273) — K28504 is NOT a clean ammonia/methane discriminator despite K10944 existing for methane MO. The actual discriminators are the Tier-2 custom HMM + the BLAST gate to AOB-clade amoA seeds; amoA_archaeal (PF12942) covers AOA; amoA_gamma covers γ-AOB (Nitrosococcus). Comammox amoA forms its own clade — see comammox synergy."
  - id: amoA_gamma
    name: Ammonia monooxygenase subunit A — γ-proteobacterial (γ-AOB / Nitrosococcus)
    category: nitrification_ammonia
    ko: [K28504]           # same shared amoA KO (K28504, NOT γ-AOB-specific) — γ-AOB fires
                           # K28504 at lower scores (Noceani ~260) than β-AOB (Neuropaea ~482),
                           # but so do pmoA and archaeal amoA. Clade discrimination comes from
                           # the custom HMM + a strict BLAST gate, NOT the KO.
    pfam: [PF02461]        # same Pfam as amoA / pmoA / AOA; clade-discriminated by the trained
                           # HMM. methanotroph pmoA is NOT excluded at the KO level (it fires
                           # K28504 too) — the BLAST gate below is what separates it.
    custom_hmm: true       # γ-AOB-specific HMM trained on Nitrosococcus halophilus /
                           # watsonii / wardiae (P-batch-3b, 2026-05-29). Calibrated to
                           # exclude β-AOB amoA (covered by the amoA target). The custom HMM
                           # does NOT fire on γ-proteobacterial methanotroph pmoA (Mcapsulatus
                           # → no HMM hit), so the HMM path is clean; the leak was on the
                           # KO+BLAST path (see gate_rationale).
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 80   # AUDIT FIX 2026-06-10: raised 55 → 80. The 55 gate was calibrated
                             # only against the VERRUCOMICROBIAL methanotroph (Mfumariolicum
                             # ~52%), but Methylococcus capsulatus is a γ-PROTEOBACTERIAL
                             # methanotroph whose pmoA is a close γ-proteo copper-MO relative of
                             # γ-AOB amoA and hits the γ-AOB seeds at 65.2% — slipping through 55
                             # and producing a hold-out FP (amoA/pmoA trap failure on the decoy).
                             # Real γ-AOB hits score ≥90% to siblings (Noceani 96.3), leaving a
                             # clean 65↔90 gap; 80 sits in it with margin both ways.
    blast_refs_uniprot: [Q9RAI1, A0A4P7BVX1]   # AUDIT 2026-06-10: removed D5BWX5 (Nitrosococcus halophilus Nc4) — it is the SAME STRAIN as the Nhalophilus_Nc4 hold-out genome, so it was a same-strain seed leak (detect_seed_leakage.py flagged Nhalophilus_Nc4/amoA_gamma). Empirically free to drop: the remaining watsonii (Q9RAI1, reviewed) + wardiae (A0A4P7BVX1, TrEMBL) seeds still detect Noceani (training TP) and Nhalophilus (hold-out, now via the wardiae sibling at ~96%, not self) at HMM bitscore ~545-550, and the γ-proteo pmoA decoy Mcapsulatus is unchanged at ~388. NOT N. oceani — that's a test organism. γ-AOB amoA is highly conserved within Nitrosococcus (~95% sibling identity).
    gate_rationale: "80 (raised from 55, audit 2026-06-10): the closest non-target is γ-PROTEOBACTERIAL methanotroph pmoA (Methylococcus capsulatus), which hits γ-AOB amoA seeds at 65.2% — far above the verrucomicrobial pmoA (~52%) the old 55 gate was tuned against. Real γ-AOB amoA scores ≥90% within Nitrosococcus (Noceani 96.3 to Q9RAI1); 80 sits in the 65↔90 gap. NB: true γ-AOB are confirmed via the custom HMM (which bypasses the gate), so this gate only governs KO-path cross-reactivity — its sole job is to reject γ-proteo pmoA on the KO tier."
    notes: "γ-AOB clade-specific amoA HMM, complementing amoA (β-AOB + comammox) and amoA_archaeal (AOA). Resolves the Noceani FN documented in REPORT § Block 2b (Noceani amoA bitscore 271 sandwiched between Mfumariolicum pmoA 274/279 on the AOB+comammox HMM — no TC separates them). Training seeds D5BWX5 + A0A4P7BVX1 carry UniProt's family-level name 'Methane monooxygenase/ammonia monooxygenase, subunit A' — TrEMBL convention for unreviewed PF02461 entries; NOT a pmoA misassignment (both organisms are obligate γ-AOB with no methanotrophic capacity; canonical AOB N-/C-terminal motifs present in sequences). See targets/amoA_gamma/manifest.yaml § notes. Runtime steps after this wiring: build_custom_hmms.py + calibrate_tc.py."
  - id: amoA_archaeal
    name: Ammonia monooxygenase subunit A — archaeal (AOA)
    category: nitrification_ammonia
    ko: []                 # no clean archaeal-specific amoA KO (K10944 conflates
                           # with methanotroph pmoA) — detect via the archaeal Pfam.
    pfam: [PF12942]
    # NO requires_blast_for_confirmation: PF12942 (Archaeal_AmoA) is archaeal-specific —
    # verified to hit ONLY the AOA genomes in the panel (score ~385, E~1e-118) and NOT
    # the AOB or methanotroph. The gate (with empty seeds) was disqualifying valid hits →
    # amoA_archaeal F1 0.00. Dropped per the P4 precedent (nirA/nirK): a specific signature
    # needs no BLAST gate. (2026-05-25)
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: []
    notes: "⚠️ Divergent archaeal AmoA detected via PF12942 (archaeal-specific; won't fire on AOB amoA or methanotroph pmoA). Pfam-only call (no KO, no gate). Distinct target from bacterial amoA; AOA lack canonical hao."
  - id: amoB
    name: Ammonia monooxygenase subunit B
    category: nitrification_ammonia
    ko: [K10945]   # pmoB-amoB (shared)
    pfam: [PF04744]
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: []
    notes: "⚠️ KO K10945 is shared verbatim with methanotroph pmoB."
  - id: amoC
    name: Ammonia monooxygenase subunit C
    category: nitrification_ammonia
    ko: [K10946]   # pmoC-amoC (shared)
    pfam: [PF04896]
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 45
    blast_refs_uniprot: [Q9LC65, A2TJ64, A2TJ66, A2TJ74]   # P2 curated: Nitrosomonas + uncultured AOB-beta AmoC (full-length)
    gate_rationale: "45 splits amoC from methanotroph pmoC. Less-strict than amoA's 55 because PF04896 (amoC/pmoC) is more conserved at the family level — full discrimination relies on the complex-completeness call (amoA-clade gates the complex, see notes)."
    notes: "⚠️ Shared with methanotroph pmoC. PF04896 assignment ⚠️ verify."
  - id: hao
    name: Hydroxylamine oxidoreductase / dehydrogenase
    category: nitrification_ammonia
    ko: [K10535]
    pfam: []   # ⚠️ no dedicated Pfam — multiheme cytochrome c clan
    custom_hmm: true
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: []
    notes: "⚠️ Tier-3: octaheme cytochrome c (P460), no clean Pfam, fold shared with NrfA family. KO + custom HMM/BLAST detection."

  # ── 3. Nitrification — nitrite oxidation ──────────────────────────────────
  - id: nxrA
    name: Nitrite oxidoreductase alpha subunit (catalytic, Mo)
    category: nitrification_nitrite
    ko: [K00370]   # ⚠️ identical KO to narG
    pfam: [PF00384, PF01568]
    pfam_logic: all
    custom_hmm: true
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 60
    blast_refs_uniprot: [Q71RT9, A0A0S4LQF4, A0A7S8FGD0]   # P2 curated NOB NxrA: Nitrobacter alkalicus + Nitrospira nitrificans/kreftii (~1145-1200 aa). identity 60 to separate from denitrifier NarG (~50%).
    gate_rationale: "60 — the strictest gate in the catalogue. NxrA and NarG share K00370 + Pfam architecture and are not sequence-separable below ~60% identity. NOB clade-to-clade: 70-90% (Nitrospira-Nitrobacter); NOB-to-denit-NarG: 45-55%. Combined with NOB-clade custom HMM + operon-synteny resolver (narI/K00374 proximity) for three-layer discrimination. Nitrobacter NxrA ≈ NarG is documented as the hardest residual case (see REPORT § Operon-synteny resolution)."
    notes: "⚠️ CENTRAL TRAP: shares KO K00370 and Pfam architecture with narG. Tier-2 custom HMM + BLAST gate to NOB-clade NxrA seeds + operon context to separate from denitrifier NarG."
  - id: nxrB
    name: Nitrite oxidoreductase beta subunit (Fe-S)
    category: nitrification_nitrite
    ko: [K00371]   # ⚠️ identical KO to narH
    pfam: [PF13247, PF13534]
    custom_hmm: true
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 55
    blast_refs_uniprot: [Q51075, A0A0S4LK29, M1KVL1]   # P2 curated NOB NxrB: Nitrobacter hamburgensis + Nitrospira nitrificans + Nitrospina (~425-513 aa). identity 55 to separate from narH.
    gate_rationale: "55 separates NxrB from NarH. Both share K00371; nxrB is the preferred NOB phylomarker (more clade-resolved than nxrA per Lücker 2010). NOB clade self-identity 75-95%; NarH cross-identity 40-50%. Looser than nxrA (60) because the NxrB-NarH gap is bigger (different β-subunit sub-families) than NxrA-NarG."
    notes: "⚠️ Shares KO K00371 with narH. nxrB is the preferred NOB phylomarker (more clade-resolved than nxrA)."

  # ── 4. Denitrification ────────────────────────────────────────────────────
  - id: narG
    name: Membrane nitrate reductase alpha subunit
    category: denitrification
    ko: [K00370]   # ⚠️ identical KO to nxrA
    pfam: [PF00384, PF01568]
    pfam_logic: all
    # custom_hmm intentionally NOT set: NarG and NOB NxrA are sequence-inseparable
    # (~60% identity, scores overlap 543 vs 544 — see nxrA manifest + validation/REPORT.md).
    # A custom narG HMM cannot discriminate the clade and risks re-introducing the
    # Nitrobacter narG false positive; the nxrA/nxrB HMMs + BLAST handle the trap instead.
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 45
    blast_refs_uniprot: []
    gate_rationale: "45 — narG is resolved from the nxrA side (nxrA's stricter 60% gate + NOB HMM excludes the NarG/NxrA family at the bitscore + identity layer). narG itself uses a looser 45 because its own seed list is empty (BLAST gate is mostly inert; the KO + Pfam + operon-synteny is the real discriminator). Anything that survives the nxrA filter and hits narG seeds at ≥45 is treated as narG."
    notes: "⚠️ CENTRAL TRAP: shares KO K00370 + Pfam with nxrA. Resolved from the nxrA side (NOB-clade HMM); NarG/NxrA are not sequence-separable, so no narG HMM."
  - id: narH
    name: Membrane nitrate reductase beta subunit
    category: denitrification
    ko: [K00371]   # ⚠️ identical KO to nxrB
    pfam: [PF13247, PF13534]
    # custom_hmm intentionally NOT set: like narG, NarH↔NxrB is not sequence-separable;
    # resolved from the nxrB side. (See nxrA manifest + validation/REPORT.md.)
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 45
    blast_refs_uniprot: []
    gate_rationale: "45 — same rationale as narG: NarH/NxrB resolved from the nxrB side (nxrB 55% gate + NOB HMM). narH itself uses a looser 45 with empty seeds; KO + Pfam + operon-synteny is the real discriminator. Pairs structurally with narG."
    notes: "⚠️ Shares KO K00371 with nxrB."
  - id: narI
    name: Membrane nitrate reductase gamma subunit (cytochrome b)
    category: denitrification
    ko: [K00374]
    pfam: [PF02665]
    blast_fallback: false
    blast_refs_uniprot: []
  - id: napA
    name: Periplasmic nitrate reductase catalytic subunit
    category: denitrification
    ko: [K02567]
    pfam: [PF00384, PF01568]
    pfam_logic: all
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: [P33937, P39185, Q56350, Q53176, Q3HS05, P81186]   # P2 curated NapA (reviewed): E.coli, Cnecator(panel), P.pantotrophus, Cereibacter, Stutzerimonas, Desulfovibrio
    notes: "⚠️ Broad Mo-oxidoreductase family (catches narG/nxrA/dmsA/fdhF). dsrA-style BLAST gate to canonical NapA seeds (per ewaste napA precedent)."
  - id: napB
    name: Periplasmic nitrate reductase small subunit (di-heme cyt c)
    category: denitrification
    ko: [K02568]
    pfam: [PF03892]
    blast_fallback: false
    blast_refs_uniprot: []
  - id: nirK
    name: Copper-containing nitrite reductase (NO-forming)
    category: denitrification
    ko: [K00368]
    pfam: [PF00394, PF07731, PF07732]
    blast_fallback: true
    blast_refs_uniprot: [P25006, P38501, Q06006, Q53239, A0A5C7VYN2, A0A1I4L3J7]   # P2 curated Cu-NIR: denitrifier (Achromobacter/Alcaligenes/Pseudomonas/Cereibacter) + AOB (Nitrosomonas oligotropha/nitrosa). identity 38 for divergent AOB/NOB NirK.
    notes: "Committing step of denitrification (NO₂⁻→NO). ⚠️ Multicopper oxidase fold is broad — BLAST gate to NirK seeds. Largely exclusive with nirS in a genome."
  - id: nirS
    name: Cytochrome cd1 nitrite reductase (NO-forming)
    category: denitrification
    ko: [K15864]
    pfam: [PF13442, PF02239]
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: []
    notes: "Heme cd1 alternative to nirK; same NO₂⁻→NO reaction. PF13442 ⚠️ shared with other cytochromes — BLAST corroboration recommended."
  - id: norB
    name: Nitric oxide reductase large subunit (cNOR)
    category: denitrification
    ko: [K04561]
    pfam: [PF00115]
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: [P98008, Q59647, A0A1H8I210, A0A939KB73, G8QI41]   # P2 curated cNOR-B γ-proteo: Stutzerimonas stutzeri + Pseudomonas aeruginosa. P-batch-3a (2026-05-29) added β-proteo seeds to lift Cupriavidus necator H16 (Q0JYR9, 25% to γ-proteo seeds) above the 40% gate: Brachymonas denitrificans (Burkholderiales/Comamonadaceae) + Comamonas denitrificans (Burkholderiales/Comamonadaceae) + Azospira oryzae (Rhodocyclales — adjacent-order safety net). No Cupriavidus/Ralstonia/Burkholderia cNor in UniRef50_P98008. — Replaces auto-fetched gene-name set that pulled fungal Norsolorinic-acid-reductase-B (M2YJQ2, Q6UEH5) + Streptomyces spectinabilin NorB (B4ER96) + a mis-headered nxrB (Q51075) — all gene-name homonyms, not NO reductase.
    notes: "⚠️ PF00115 (heme-copper oxidase) is shared with cytochrome c oxidase coxA — BLAST gate to NorB clade. Gene name 'norB' is overloaded with fungal Norsolorinic-acid-reductase-B and Streptomyces spectinabilin biosynthesis NorB — bare gene-name auto-fetch contaminates the seed set, so explicit accessions are required."
  - id: norC
    name: Nitric oxide reductase small subunit (cNOR, cytochrome c)
    category: denitrification
    ko: [K02305]
    pfam: [PF00034]
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: []
    notes: "⚠️ PF00034 (cyt c) is ubiquitous — BLAST gate required."
  - id: norZ
    name: Quinol-dependent nitric oxide reductase (qNOR, single-subunit)
    category: denitrification
    ko: [K04748, K04561]   # CORRECTION (audit 2026-06-10): K04748 is NOT the qNor catalytic KO — KOfam defines K04748 = "nitric oxide reductase NorQ protein", a cytoplasmic MoxR/vWA-family maturation ATPase (cNOR cofactor assembly), a DIFFERENT gene product from the qNor catalytic subunit. It is retained here only as an inert legacy anchor (it does not fire on real qNor catalytic sequences, as expected). The actual qNor signal is K04561 (= NorB catalytic, EC 1.7.2.5, shared with cNor) disambiguated from cNor via the qNor-clade BLAST gate (cNor proteins won't match qNor seeds above 40% identity, and vice versa). Verified on Cnecator H16's Q0JYR9 (real qNor, fires K04561 at 1044, no K04748 hit).
    pfam: [PF00115]
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 40
