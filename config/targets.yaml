# ─────────────────────────────────────────────────────────────────────────────
# Obligatory complexes — must find ALL members for the function to be present.
# ─────────────────────────────────────────────────────────────────────────────
complexes:
  nitrogenase:
    members: [nifH, nifD, nifK]
    obligatory: true
    application: "N2 fixation (N2 => NH3); orphan nifH without nifDK is non-functional"
  ammonia_monooxygenase:
    members: [[amoA, amoA_gamma, amoA_archaeal], amoB, amoC]   # P5.3.3 (2026-05-30): any-of slot for the catalytic subunit. γ-AOB (Nitrosococcus → amoA_gamma) and AOA (→ amoA_archaeal) carry their own clade-specific AmoA paralogs but share amoB/amoC. Evaluator extended to support any-of slots (compute_complex_completeness.py:75-90) mirroring the synergy pattern.
    obligatory: true
    application: "Ammonia oxidation step 1 (NH3 => NH2OH); catalytic AmoA slot accepts β-AOB+comammox (amoA), γ-AOB (amoA_gamma), or AOA (amoA_archaeal). ⚠️ co-validate against amoA-clade not pmoA-clade"
  nitrite_oxidoreductase:
    members: [nxrA, nxrB]
    obligatory: true
    application: "Nitrite oxidation (NO2- => NO3-); ⚠️ shares KOs with narGH — requires NOB-clade BLAST"
  membrane_nitrate_reductase:
    members: [narG, narH, narI]
    obligatory: true
    application: "Dissimilatory nitrate reduction (NO3- => NO2-), membrane-bound"
  periplasmic_nitrate_reductase:
    members: [napA, napB]
    obligatory: true
    application: "Periplasmic nitrate reduction (NO3- => NO2-)"
  no_reductase_cnor:
    members: [norB, norC]
    obligatory: true
    application: "NO => N2O (cNOR); qNOR/norZ is a single-subunit alternative"
  hydrazine_synthase:
    members: [hzsA, hzsB, hzsC]
    obligatory: true
    application: "Anammox hydrazine synthesis (NO + NH4+ => N2H4); the obligate anammox signature"
  glutamate_synthase:
    members: [gltB, gltD]
    obligatory: true
    application: "GS/GOGAT ammonia assimilation (Gln + 2-OG => 2 Glu)"
  urease:
    members: [ureA, ureB, ureC]
    obligatory: true
    application: "Organic-N mineralization (urea => NH3); ureG (and ureDEF) needed for activation"

# ─────────────────────────────────────────────────────────────────────────────
# Process-completeness modules — scored as completeness fractions, interpreted in
# the gap-analysis report. Each entry in `requires` is a slot: a single target id
# (must be present) or a list of equivalents (any-of — paralog substitutes count).
# Optional `forbids:` lists targets that must be ABSENT for the phenotype to hold
# (used by named-partial synergies like n2o_emitter / n2o_sink_only).
# Optional `single_organism: true` marks phenotypes that can't be community-
# completed (e.g., comammox, anammox) — only complete (all slots) or absent.
# ─────────────────────────────────────────────────────────────────────────────
synergies:
  - name: complete_denitrification
    requires: [[narG, napA], [nirS, nirK], [norB, norZ], [nosZ, nosZ_clade2]]   # P5.3.2 (2026-05-30): terminal slot now accepts clade-I OR clade-II NosZ.
    benefit: "Full NO3- => N2 respiration. Slot any-of: nar/nap, nirS/nirK, cNOR(norB)/qNOR(norZ), clade-I or clade-II NosZ. Partial denitrifiers are the norm."
  - name: n2o_sink
    requires: [[nosZ, nosZ_clade2]]   # P5.3.2 (2026-05-30): either NosZ clade is a biological N2O sink.
    benefit: "Only biological N2O sink. nosZ-II without upstream nir/nor = dedicated N2O consumer; absence of any nosZ with nir+nor present = net N2O source (greenhouse-gas relevant)."
  - name: comammox
    requires: [amoA, hao, nxrA, nxrB]
    single_organism: true
    benefit: "Complete nitrification in one organism (NH3 => NO3-); requires comammox-clade amoA (Nitrospira lineage II). Single-organism phenotype — cannot be community-completed."
  - name: anammox_complete
    requires: [hzsA, hzsB, hzsC, hdh]
    single_organism: true
    benefit: "Functional anammox (NH4+ + NO2- => N2); add nirS/nirK for NO supply. Confirms a true anammox bacterium vs spurious hzs fragments. Single-organism phenotype."
  - name: dnra_branch
    requires: [[napA, narG], nrfA]
    benefit: "N-retentive nitrate respiration (NO3- => NH4+). Either nap or nar can supply nitrite to NrfA. Contrast with denitrification at the nitrite node (nrfA vs nir decides retain-vs-lose N)."
  - name: nitrifier_denitrification
    requires: [[amoA, amoA_gamma, amoA_archaeal], [nirK, nirS], [norB, norZ]]   # P5.3.1 (2026-05-30): any-of amoA paralogs. γ-AOB (amoA_gamma covers Nitrosococcus) + AOA (amoA_archaeal) also exhibit nitrifier-denit (env-microbio audit); without this slot, Noceani's γ-AOB nitrifier-denit phenotype doesn't fire even though amoA_gamma detects it.
    benefit: "Cryptic N2O source: ammonia oxidizers reducing their own nitrite (nir/nor co-occurring with amo). Slot accepts amoA / amoA_gamma / amoA_archaeal."
  - name: assimilatory_complete
    requires: [[nasA, narB], [nirA, nasD], glnA, gltB]
    benefit: "End-to-end biomass-N from nitrate (NO3- => NH4+ => Glu). nasA/narB are equivalent nitrate-assimilatory reductases; nirA/nasD are equivalent assimilatory nitrite reductases."

  # ── Named partials — ecologically distinct truncated states (use `forbids:`) ─
  - name: n2o_emitter
    requires: [[nirS, nirK], [norB, norZ]]
    forbids: [nosZ, nosZ_clade2]   # P5.3.2 (2026-05-30): organism is an N2O emitter only if NEITHER clade-I nor clade-II NosZ is present.
    benefit: "Net N2O source: makes NO/N2O but no terminal NosZ (clade-I or clade-II) to mop it up. Greenhouse-gas relevant; the typical 'truncated denitrifier' phenotype."
  - name: n2o_sink_only
    requires: [[nosZ, nosZ_clade2]]   # P5.3.2 (2026-05-30): either NosZ clade qualifies as N2O sink.
    forbids: [nirS, nirK, norB, norZ]
    benefit: "Dedicated N2O consumer: reduces ambient N2O without producing it (sink-only ecology, strongly enriched in clade-II/atypical NosZ lineages). Environmental N2O mitigators. See also nosZ_clade_I_likely for the canonical-denitrifier counterpart."
  - name: nosZ_clade_I_likely
    requires: [nosZ, [nirS, nirK, norB, norZ]]
    forbids: [nosZ_clade2]   # P5.3.2 (2026-05-30): phylogeny-rigorous now that the clade-II HMM exists (P-batch-3d); previously a heuristic. clade-I call fires only when canonical nosZ + upstream denit AND no clade-II detection.
    benefit: "Clade-I/typical denitrifier-nosZ pattern: canonical nosZ co-occurring with upstream denit (nir/nor), with no clade-II detection. Phylogeny-rigorous since P5.3.2 (uses the nosZ_clade2 HMM for clade discrimination)."
  - name: nitrate_to_nitrite_leak
    requires: [[narG, napA]]
    forbids: [nirS, nirK, nrfA]
    benefit: "Reduces NO3- => NO2- but lacks downstream dissimilatory NO2- reductases (no denit-entry, no nrfA DNRA). Leaks NO2- to the environment — feeds anammox/NOB partners."
